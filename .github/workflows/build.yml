name: Build Sorrow Integration

# Based on geode-sdk/build-geode-mod's official multi-platform example.
# Each platform uploads its own .geode (e.g. "Windows"), and the "package"
# job merges all of them into one .geode that works on every platform.

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
        - name: Windows
          os: windows-latest

        - name: macOS
          os: macos-latest

        - name: iOS
          os: macos-latest
          target: iOS

        - name: Android32
          os: ubuntu-latest
          target: Android32

        - name: Android64
          os: ubuntu-latest
          target: Android64

    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Build the mod
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          combine: true
          target: ${{ matrix.config.target }}

      - name: Upload this platform's .geode
        uses: actions/upload-artifact@v4
        with:
          name: Sorrow-Integration-${{ matrix.config.name }}
          path: ${{ steps.build.outputs.build-output }}

  package:
    name: Package builds
    runs-on: ubuntu-latest
    needs: ['build']
    # merge whatever platforms built, even if one of them failed
    if: ${{ !cancelled() }}

    steps:
      - uses: geode-sdk/build-geode-mod/combine@main
        id: build

      - uses: actions/upload-artifact@v4
        with:
          name: Sorrow-Integration-All-Platforms
          path: ${{ steps.build.outputs.build-output }}
